<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Late In Exception Management</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; background: #f3f2f1; height: 100vh; display: flex; flex-direction: column; }
        /* Header */
        .app-header { background: #ffffff; border-bottom: 1px solid #e1dfdd; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .app-title { font-size: 16px; font-weight: 600; color: #252423; }
        .app-subtitle { font-size: 12px; color: #605e5c; margin-top: 2px; }
        .persona-selector { display: flex; align-items: center; gap: 8px; }
        .persona-selector label { font-size: 12px; color: #605e5c; font-weight: 600; }
        .persona-selector select { padding: 6px 10px; border: 1px solid #8a8886; border-radius: 2px; font-size: 12px; background: white; cursor: pointer; font-weight: 400; color: #252423; }
        
        /* Chat Container */
        .chat-wrapper { flex: 1; display: flex; justify-content: center; overflow: hidden; background: #f3f2f1; }
        .chat-container { width: 100%; max-width: 700px; overflow-y: auto; padding: 16px; }
        /* Messages */
        .message { margin-bottom: 12px; animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .message-content { background: white; padding: 12px 16px; border-radius: 4px; box-shadow: 0 0.3px 0.9px rgba(0,0,0,0.1), 0 1.6px 3.6px rgba(0,0,0,0.13); border: 1px solid #e1dfdd; font-size: 14px; line-height: 1.5; color: #252423; white-space: pre-line; }
        /* Buttons - Teams Style */
        .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .btn { padding: 6px 16px; border: 1px solid #8a8886; border-radius: 2px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.1s; font-family: inherit; background: white; color: #252423; }
        .btn:hover { background: #f3f2f1; border-color: #605e5c; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
        .btn-primary { background: #6264a7; color: white; border-color: #6264a7; }
        .btn-primary:hover { background: #464775; border-color: #464775; }
        .btn-success { background: #92c353; color: white; border-color: #92c353; }
        .btn-success:hover { background: #7ba33c; border-color: #7ba33c; }
        .btn-danger { background: #c4314b; color: white; border-color: #c4314b; }
        .btn-danger:hover { background: #a52a3f; border-color: #a52a3f; }
        .btn-secondary { background: white; color: #252423; border: 1px solid #8a8886; }
        .btn-secondary:hover { background: #f3f2f1; }
        /* Record Cards - Teams Adaptive Card Style */
        .record-card { background: white; border: 1px solid #e1dfdd; border-radius: 4px; padding: 16px; margin-bottom: 12px; box-shadow: 0 0.3px 0.9px rgba(0,0,0,0.1), 0 1.6px 3.6px rgba(0,0,0,0.13); transition: all 0.1s; }
        .record-card:hover { box-shadow: 0 3.2px 7.2px rgba(0,0,0,0.13), 0 0.6px 1.8px rgba(0,0,0,0.11); border-color: #c8c6c4; }
        .record-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #edebe9; }
        .record-employee-name { font-size: 16px; font-weight: 600; color: #252423; margin-bottom: 2px; }
        .record-employee-id { font-size: 12px; color: #605e5c; font-weight: 400; }
        .record-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; background: #faf9f8; padding: 12px; border-radius: 2px; }
        .record-label { font-size: 11px; font-weight: 600; color: #605e5c; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 3px; }
        .record-value { font-size: 13px; font-weight: 600; color: #252423; }
        .record-value.danger { color: #c4314b; font-weight: 700; }
        /* Form - Teams Style */
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 12px; font-weight: 600; color: #252423; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 8px 12px; border: 1px solid #8a8886; border-radius: 2px; font-size: 14px; font-family: inherit; transition: all 0.1s; }
        .form-control:focus { outline: none; border-color: #6264a7; box-shadow: 0 0 0 1px #6264a7; }
        textarea.form-control { resize: vertical; min-height: 80px; }
        /* Alert - Teams Style */
        .alert { padding: 12px; border-radius: 2px; margin: 12px 0; font-size: 13px; border-left: 3px solid; }
        .alert-warning { background: #fff4ce; color: #605e5c; border-left-color: #ffaa44; }
        .alert-success { background: #dff6dd; color: #605e5c; border-left-color: #92c353; }
        .alert-info { background: #deecf9; color: #605e5c; border-left-color: #6264a7; }
        .success-box { background: #dff6dd; border: 1px solid #92c353; border-radius: 2px; padding: 12px; margin: 12px 0; }
        .summary-item { margin: 6px 0; font-size: 13px; color: #252423; }
        .file-upload { border: 2px dashed #8a8886; border-radius: 2px; padding: 16px; text-align: center; cursor: pointer; transition: all 0.1s; background: #faf9f8; }
        .file-upload:hover { border-color: #6264a7; background: #f3f2f1; }
        .file-upload input { display: none; }
        /* Scrollbar - Teams Style */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f3f2f1; }
        ::-webkit-scrollbar-thumb { background: #c8c6c4; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #a19f9d; }
        /* Chat Input */
        .chat-input-wrapper { background: white; border-top: 1px solid #e1dfdd; padding: 12px 20px; display: flex; gap: 8px; align-items: center; }
        .chat-input { flex: 1; padding: 8px 12px; border: 1px solid #8a8886; border-radius: 2px; font-size: 14px; font-family: 'Segoe UI', sans-serif; resize: none; min-height: 40px; max-height: 120px; }
        .chat-input:focus { outline: none; border-color: #6264a7; box-shadow: 0 0 0 1px #6264a7; }
        .chat-send-btn { padding: 8px 20px; background: #6264a7; color: white; border: none; border-radius: 2px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.1s; box-shadow: 0 0.3px 0.9px rgba(0,0,0,0.1), 0 1.6px 3.6px rgba(0,0,0,0.13); }
        .chat-send-btn:hover { background: #464775; }
        .chat-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        /* User message style */
        .user-message { margin-left: auto; max-width: 70%; }
        .user-message .message-content { background: #deecf9; border-color: #6264a7; }
        /* Responsive */
        @media (max-width: 768px) {
            .chat-container { padding: 12px; }
            .record-grid { grid-template-columns: 1fr; }
            .record-card { padding: 12px; }
            .chat-input-wrapper { padding: 8px 12px; }
        }
    </style>
</head>
<body>
    <div class="app-header">
        <div>
            <div class="app-title">Late In Exception Management</div>
            <div class="app-subtitle">Review and process attendance exceptions</div>
        </div>
        <div class="persona-selector">
            <label for="persona">Role:</label>
            <select id="persona" onchange="resetChat()">
                <option value="StationManager">Station Manager</option>
                <option value="AMHUser">AMH User</option>
            </select>
        </div>
    </div>
    <div class="chat-wrapper">
        <div class="chat-container" id="chatContainer"></div>
    </div>
    <div class="chat-input-wrapper">
        <textarea id="chatInput" class="chat-input" placeholder="Type a message or use the buttons above..." rows="1" onkeydown="handleChatInputKeydown(event)" oninput="autoResizeTextarea(this)"></textarea>
        <button class="chat-send-btn" onclick="sendChatMessage()">
            <span style="font-size: 16px;">➤</span>
        </button>
    </div>
    <script src="chat.js"></script>
</body>
</html>
